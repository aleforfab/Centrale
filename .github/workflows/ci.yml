name: CI

# Test every branch, not just main. A contributor's branch must fail loudly
# before it reaches a pull request, and pull requests get a check of their own.
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          cd dancing-with-sars-backend
          pip install -r requirements.txt -r requirements-dev.txt
      
      - name: Lint with ruff
        run: |
          cd dancing-with-sars-backend
          ruff check .
      
      - name: Test with pytest
        run: |
          cd dancing-with-sars-backend
          pytest -q
        env:
          ENABLE_SENTINEL1_FALLBACK: "false"
          PRODUCTS_DIR: "./products"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: |
          cd dancing-with-the-sars-frontend
          npm ci
      
      - name: Typecheck
        run: |
          cd dancing-with-the-sars-frontend
          npm run typecheck
        env:
          BACKEND_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_MAPBOX_TOKEN: "dummy_token"

      - name: Frontend tests
        run: |
          cd dancing-with-the-sars-frontend
          npm test
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: "dummy_token"
      
      - name: Build
        run: |
          cd dancing-with-the-sars-frontend
          npm run build
        env:
          BACKEND_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_MAPBOX_TOKEN: "dummy_token"
